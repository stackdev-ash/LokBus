name: lokbus_clean
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  socket_io_client: ^3.1.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.0
  shimmer: ^2.0.0
  flutter_polyline_points: ^2.0.0
  google_polyline_algorithm: ^3.1.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/LokBus4.png
    - assets/images/bg_bus.png
    - assets/images/LokBus7.png
    - assets/data/routes.json
    - assets/images/splash_screen.png
    - assets/data/stations.json